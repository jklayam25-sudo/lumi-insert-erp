services:
  app:
    build: .
    image: lumi-insert:latest 
    environment:
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}
      - SMTP_MAIL_USERNAME=${SMTP_MAIL_USERNAME}
      - SMTP_MAIL_PASSWORD=${SMTP_MAIL_PASSWORD}
      - CLOUDINARY_URL=${CLOUDINARY_URL}
      - DB_HOST=database
      - RABBITMQ_HOST=rabbit-mq
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - database
      - rabbit-mq
    volumes:
      - ./logs:/app/logs
      - maven-cache:/root/.m2

  database:
    image: postgres:18.1-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./database:/var/lib/postgresql

  rabbit-mq:
    image: rabbitmq:3-management-alpine 
    volumes:
      - ./rabbitmq_data:/var/lib/rabbitmq

  promtail:
    image: grafana/promtail:latest
    depends_on:
      - app
      - loki
    volumes:
      - ./logs:/var/log
      - ./promtail.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    

  loki:
    image: grafana/loki:latest
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      - ./loki_data:/tmp/loki
    command: -config.file=/etc/loki/config.yaml
  
  prometheus:
    image: prom/prometheus:latest
    user: "1000:1000"
    depends_on:
      - app
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/config.yaml:ro
      - ./prometheus_data:/prometheus
    command: 
    - '--config.file=/etc/prometheus/config.yaml'
    - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    depends_on:
      - loki
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-limit.conf:/etc/nginx/conf.d/01-limit.conf:ro
      - ./nginx-config.conf:/etc/nginx/conf.d/default.conf:ro 
      - ./generalnginx-config.inc:/etc/nginx/general.inc 
volumes:
  maven-cache: